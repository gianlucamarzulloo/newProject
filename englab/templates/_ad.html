{# Spazio pubblicitario: visibile solo se ENGLAB_ADSENSE_CLIENT è configurato #}
{% if settings.adsense_client and settings.adsense_slot %}
<div class="ad-slot" aria-label="Pubblicità">
  <ins class="adsbygoogle" style="display:block" data-ad-client="{{ settings.adsense_client }}"
       data-ad-slot="{{ settings.adsense_slot }}" data-ad-format="auto" data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>
{% endif %}
